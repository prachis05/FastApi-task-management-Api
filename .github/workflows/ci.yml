
name: FastAPI CI Pipeline

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./ci.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx coverage ruff pip-audit

      - name: Lint Python code
        run: ruff check app tests test_main.py

      - name: Run tests with coverage
        run: |
          coverage run --source=app -m pytest -v
          coverage report --fail-under=80
          coverage xml

      - name: Scan dependencies for vulnerabilities
        run: pip-audit -r requirements.txt

      - name: Build Docker image
        run: docker build -t task-management-api:${{ github.sha }} .
